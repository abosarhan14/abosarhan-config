<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ايجي توك</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0E0F13">
<meta name="apple-mobile-web-app-title" content="ايجي توك">

<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#1e6fe8;color:#fff;font-family:system-ui,Tahoma,sans-serif;text-align:center}
.b{padding:24px}
.sp{width:46px;height:46px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:22px;margin:0 0 8px}#s{opacity:.85;font-size:15px}
button{display:none;margin-top:18px;padding:10px 24px;border:0;border-radius:10px;font-size:16px;background:#fff;color:#1e6fe8}
</style>
</head>
<body>
<div class="b">
  <div class="sp" id="sp"></div>
  <h1>ايجي توك</h1>
  <div id="s">جاري الاتصال...</div>
  <button id="rt" onclick="location.reload()">إعادة المحاولة</button>
</div>
<script>
(function(){
  var RAW="https://raw.githubusercontent.com/abosarhan14/abosarhan-config/main/current_url.txt";
  var KEY="egy_base", MAX=40, tries=0, done=false;
  var m=location.search.match(/[?&]ref=(\d+)/);
  var path="/abosarhan_chat/"+(m?"register.php?ref="+m[1]:"");
  var st=document.getElementById("s");

  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  function timeout(ms,p){return new Promise(function(res,rej){var t=setTimeout(function(){rej("t")},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}

  function ping(base){
    return timeout(6000,fetch(base+"/abosarhan_chat/ping.php?t="+Date.now(),{cache:"no-store"}))
      .then(function(r){return r.json()})
      .then(function(j){if(j&&j.ok)return base;throw "no"});
  }
  function latest(){
    return timeout(6000,fetch(RAW+"?t="+Date.now(),{cache:"no-store"}))
      .then(function(r){return r.text()})
      .then(function(t){var x=t.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/);if(!x)throw "nourl";return x[0]});
  }
  function go(base){
    if(done)return;done=true;set(KEY,base);
    st.textContent="تم! جاري الفتح...";
    location.replace(base+path);
  }
  // first success wins
  function any(list){
    return new Promise(function(res,rej){
      var n=list.length,fails=0;
      list.forEach(function(p){p.then(res,function(){if(++fails===n)rej()})});
    });
  }

  function attempt(){
    if(done)return;
    tries++;
    var cached=get(KEY);
    var jobs=[];
    if(cached)jobs.push(ping(cached));                 // آخر رابط شغّال (سريع)
    jobs.push(latest().then(ping));                    // الرابط الحالي من GitHub
    any(jobs).then(go,function(){
      if(tries>=MAX){
        document.getElementById("sp").style.display="none";
        st.textContent="تعذّر الاتصال بالمنصة الآن";
        document.getElementById("rt").style.display="inline-block";
        return;
      }
      st.textContent="جاري الاتصال... محاولة "+tries;
      setTimeout(attempt,3000);
    });
  }
  attempt();
})();
</script>
</body>
</html>
